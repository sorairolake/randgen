[package]
name = "randgen"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "Generate pseudo-random bytes"
repository = "https://github.com/sorairolake/randgen"
license = "Apache-2.0 OR MIT"
keywords = ["random"]
categories = ["command-line-utilities"]
include = ["/LICENSES", "/README.md", "/src"]

[dependencies]
anyhow = "1.0.102"
base64 = { version = "0.22.1", optional = true }
byte-unit = "5.2.0"
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
clap_complete = "4.5.66"
clap_complete_nushell = "4.6.0"
faster-hex = { version = "0.10.0", default-features = false, features = ["std"], optional = true }
indicatif = "0.18.4"
rand_chacha = "0.10.0"
rand_hc = { version = "0.5.0", optional = true }
rand_isaac = { version = "0.5.0", optional = true }
rand_mt = { version = "6.0.3", optional = true }
rand_pcg = { version = "0.10.2", optional = true }
rand_sfc = { version = "0.2.0", optional = true }
rand_xorshift = { version = "0.5.0", optional = true }
rand_xoshiro = "0.8.0"
sigpipe = "0.1.3"
sysexits = "0.11.0"

[dependencies.rand]
version = "0.10.1"
default-features = false
features = ["std", "sys_rng"]

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"

[features]
default = ["base64", "hc", "hex", "isaac", "mt", "pcg", "sfc", "xorshift"]
base64 = ["dep:base64"]
hc = ["dep:rand_hc"]
hex = ["dep:faster-hex"]
isaac = ["dep:rand_isaac"]
mt = ["dep:rand_mt"]
pcg = ["dep:rand_pcg"]
sfc = ["dep:rand_sfc"]
xorshift = ["dep:rand_xorshift"]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
